worker_processes 1;

error_log /home/lihaoqian/project/clouddisk_v2/forward_part/config/nginx/nginx_error.log info;
pid /home/lihaoqian/project/clouddisk_v2/forward_part/config/nginx/nginx.pid;

events {
	worker_connections 1024;
}

http {
	# MIME types
	include /usr/local/openresty/nginx/conf/mime.types;
	default_type application/octet-stream;

	# 带 request_id 的日志格式
	log_format traced '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
	'rid=$http_x_request_id rt=$request_time';
	access_log /home/lihaoqian/project/clouddisk_v2/forward_part/config/nginx/nginx_access.log traced;

	# 性能优化
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	# Gzip 压缩
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/xml text/javascript
	application/x-javascript application/xml+rss
	application/json application/javascript;

	lua_package_path "/home/lihaoqian/project/clouddisk_v2/forward_part/config/nginx/?.lua;;";

	lua_shared_dict consul_services 10m;

	# ============ 动态 upstream ============
	upstream cloudisk_backend {
		# 本地开发环境固定转发到 Gateway :38080，避免依赖镜像内缺失的 lua-resty-http。
		server 10.42.0.1:38080;
	}
	# ============ HTTP 路由 ============
	server {
		listen 2024;
		server_name _;
		client_max_body_size 128m;

		# CORS headers
		add_header Access-Control-Allow-Origin * always;
		add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Requested-With,X-Request-Id" always;
		add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
		add_header Access-Control-Max-Age 86400 always;

		# CORS preflight
		if ($request_method = OPTIONS) {
			return 204;
		}

		access_by_lua_block {
			-- 1 优先用上游传入的 X-Request-Id
			local rid = ngx.var.http_x_request_id

			-- 2 没有则生成一个（无需额外依赖库的简易方案）
			if not rid or rid == "" then
			rid = string.format("%s-%d-%s-%s",
			ngx.now(),
			ngx.worker.pid(),
			ngx.var.connection or "0",
			ngx.var.connection_requests or "0"
			)
			end

			-- 3 存到 ctx,供 balancer_by_lua 使用
			ngx.ctx.request_id = rid

			-- 4 向后端透传，方便全链路一致
			ngx.req.set_header("X-Request-Id", rid)

			-- 5 在响应中返回 X-Request-Id
			ngx.header["X-Request-Id"] = rid
		}

		root /home/lihaoqian/project/clouddisk_v2/forward_part/static/dist;
		##########################静态文件访问###############################

		# API 路由优先匹配（精确匹配优先级最高）
		##########################用户服务访问##################################
		location = /user/signin {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /user/signup {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

			location = /user/info {
				proxy_pass http://cloudisk_backend;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			}

			location = /user/token/blacklist {
				proxy_pass http://cloudisk_backend;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			}

		location = /user/sendcode {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /user/code {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
		#########################文件服务访问######################################
		location = /file/query {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /file/upload {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_request_buffering off;
			proxy_buffering off;
		}

		location = /file/download {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /file/showfile {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /file/delete {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
		#########################上传大文件######################################
		location = /file/initupload {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /file/uploadpart {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_request_buffering off;
			proxy_buffering off;
		}

		location = /file/PresignParts {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /file/CompleteMultipart {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /file/AbortMultipart {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location = /file/Status {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		############################AI服务######################################
		location = /AI {
			proxy_pass http://cloudisk_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		############################静态文件服务######################################
		# 静态资源（JS/CSS/图片等）缓存优化
		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
			expires 1y;
			add_header Cache-Control "public, immutable";
			try_files $uri =404;
		}

		# assets 目录
		location /assets/ {
			expires 1y;
			add_header Cache-Control "public, immutable";
			try_files $uri =404;
		}

		# 前端路由 fallback（必须放在最后）
		location / {
			try_files $uri $uri/ /index.html;
			index index.html;
		}
	}

	server {
		listen 2025;
		server_name _;

		location /preview/ {
			alias /home/lihaoqian/project/clouddisk_v2/storage/;
			autoindex off;
			add_header Accept-Ranges bytes always;

			if ($arg_filename != "") {
				add_header Content-Disposition "inline; filename*=UTF-8''$arg_filename" always;
			}
		}

		location /download/ {
			alias /home/lihaoqian/project/clouddisk_v2/storage/;
			autoindex off;
			add_header Accept-Ranges bytes always;

			if ($arg_filename != "") {
				add_header Content-Disposition "attachment; filename*=UTF-8''$arg_filename" always;
			}
			if ($arg_filename = "") {
				add_header Content-Disposition "attachment" always;
			}
		}
	}
}

syntax = "proto3";

package file;
option go_package = "clouddisk_v2/file_srv/protobuf;filepb";

message ReqFileDown {
  string username  = 1;
  string userid    = 2;
  string filename  = 3;
  string filehash  = 4;
  int32  file_size = 5;
}

message FileInfo {
  string file_hash    = 1;
  string file_name    = 2;
  int64  file_sizes   = 3;
  string upload_at    = 4;
  string last_updated = 5;
}

message ReqFileQuery {
  string username = 1;
  string userid   = 2;
}

message RespFileQuery {
  int32             code    = 1;
  string            message = 2;
  repeated FileInfo files   = 3;
}

message Reqloadfile {
  string username  = 1;
  string userid    = 2;
  string filename  = 3;
  bytes  content   = 4;
  string file_hash = 5;
  int32  file_size = 6;
}

message Reqshowfile  {
  string username  = 1;
  string userid    = 2;
  string filename  = 3;
  string filehash  = 4;
  int32  file_size = 5;
}

message Resp {
  int32  code    = 1;
  string message = 2;
}

message ReqResolveFileHash {
  string userid   = 1; // 建议仍保留，方便调试；真正以服务端注入为准
  string filename = 2; // 用户文件名（UserFile.Name）
}

message RespResolveFileHash {
  int32  code      = 1;
  string message   = 2;
  string file_hash = 3; // File.Sha1
  int64  file_size = 4; // File.Size
}

message InitReq {
  string user_id      = 1;
  string file_name    = 2;
  int64  file_size    = 3;
  string file_hash    = 4;
  string content_type = 5;
}

message InitResp {
  string upload_id   = 1;
  string object_key  = 2;
  int64  part_size   = 3;
  int32  total_parts = 4;
}

message UploadPartMeta {
  string upload_id   = 1;
  int32  part_number = 2; // 1..10000
  int64  part_size   = 3; // bytes
  string chunk_hash  = 4; // optional
}

message UploadPartReq {
  oneof payload {
    UploadPartMeta meta = 1; // first message
    bytes          data = 2; // following messages
  }
}

message UploadPartResp {
  string upload_id   = 1;
  int32  part_number = 2;
  int64  part_size   = 3;
  string etag        = 4;
}

message CompleteReq { string upload_id = 1; }

message CompleteResp {
  string upload_id  = 1;
  string object_key = 2;
  string etag       = 3;
  string status     = 4;
}

message AbortReq { string upload_id = 1; }

message AbortResp {}

message StatusReq { string upload_id = 1; }

message StatusResp {
  int32          total_parts    = 1;
  repeated int32 uploaded_parts = 2;
}

message ReqDeleteFile {
  string username = 1;
  string userid   = 2;
  string filename = 3;
  string filehash = 4;
}

service fileService {
  rpc filedowm(ReqFileDown) returns (Resp) {}
  rpc LoadFile(Reqloadfile) returns (Resp) {}
  rpc Showfile(Reqshowfile) returns (Resp ) {}
  rpc filequeryinfo(ReqFileQuery) returns (RespFileQuery) {}
  rpc ResolveFileHash(ReqResolveFileHash) returns (RespResolveFileHash) {}

  rpc InitMultipart(InitReq) returns (InitResp);
  rpc UploadPart(stream UploadPartReq) returns (UploadPartResp);
  rpc CompleteMultipart(CompleteReq) returns (CompleteResp);
  rpc AbortMultipart(AbortReq) returns (AbortResp);
  rpc Status(StatusReq) returns (StatusResp);
  rpc DeleteFile(ReqDeleteFile) returns (Resp);
}

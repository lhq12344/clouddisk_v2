apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-server:v3.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: "standalone"
            - name: SPRING_DATASOURCE_PLATFORM
              value: "mysql"
            - name: MYSQL_SERVICE_HOST
              value: "mysql-svc.infra.svc"
            - name: MYSQL_SERVICE_PORT
              value: "3306"
            - name: MYSQL_SERVICE_DB_NAME
              value: "nacos_config"
            - name: MYSQL_SERVICE_USER
              value: "root"
            - name: MYSQL_SERVICE_PASSWORD
              value: "123456"
            - name: JVM_XMS
              value: "512m"
            - name: JVM_XMX
              value: "512m"
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              value: "RPJpczNwUH/rzXSfqbMpEuWWl02qYUsFEhpFESCu5A8="
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "serverIdentity"
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: "cloudDisk2025"
          ports:
            - containerPort: 8848
            - containerPort: 9848
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
      volumes:
        - name: nacos-data
          persistentVolumeClaim:
            claimName: nacos-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-data
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: infra
spec:
  type: NodePort
  ports:
    - name: server
      port: 8848
      targetPort: 8848
      nodePort: 30848
    - name: console
      port: 8080
      targetPort: 8080
      nodePort: 30880
    - name: grpc
      port: 9848
      targetPort: 9848
      nodePort: 31848
  selector:
    app: nacos
